{% extends layout_template %}
{% block title %}Notifications{% endblock %}
{% block content %}
<section class="p-4 sm:p-8 max-w-5xl mx-auto w-full">
    <div class="app-page-header !p-0 !mb-6">
        <div>
            <h1>Notifications</h1>
            <p>Updates relevant to your work and assigned workflows.</p>
        </div>
        <button id="markAllButton" type="button" onclick="markAllNotificationsRead()" class="app-button app-button--secondary">Mark all as read</button>
    </div>
    <div class="app-surface overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
            <span class="app-section-title">All notifications</span>
            <span id="unreadSummary" class="app-meta"></span>
        </div>
        <div id="notificationHistory" class="divide-y divide-slate-100" aria-live="polite">
        <div class="workspace-empty"><strong>Loading notifications</strong><span>Retrieving your latest work updates.</span></div>
        </div>
        <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-between">
            <span id="pageSummary" class="text-xs text-slate-500"></span>
            <div class="flex gap-2">
                <button id="previousPage" type="button" onclick="loadNotificationHistory(currentPage - 1)" class="border px-3 py-1.5 rounded-lg text-xs font-bold disabled:opacity-40">Previous</button>
                <button id="nextPage" type="button" onclick="loadNotificationHistory(currentPage + 1)" class="border px-3 py-1.5 rounded-lg text-xs font-bold disabled:opacity-40">Next</button>
            </div>
        </div>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script>
let currentPage = 1;
const pageSize = 25;

function notificationIcon(type) {
    const value = String(type || '').toUpperCase();
    if (value.includes('SECURITY')) return '!';
    if (value.includes('APPROVAL')) return '✓';
    if (value.includes('TASK')) return '□';
    return '•';
}

async function loadNotificationHistory(page = 1) {
    if (page < 1) return;
    currentPage = page;
    const container = document.getElementById("notificationHistory");
    container.innerHTML = '<div class="p-10 text-center text-slate-400 text-sm">Loading notifications...</div>';
    try {
        const response = await fetch(`/api/v1/notifications/?skip=${(page - 1) * pageSize}&limit=${pageSize}`);
        if (response.status === 401) {
            window.location.href = "/auth/login";
            return;
        }
        if (!response.ok) throw new Error("Unable to load notifications");
        const items = await response.json();
        const unreadResponse = await fetch("/api/v1/notifications/unread-count");
        const unread = unreadResponse.ok ? (await unreadResponse.json()).count : 0;
        document.getElementById("unreadSummary").textContent = `${unread} unread`;
        document.getElementById("pageSummary").textContent = `Page ${page}`;
        document.getElementById("previousPage").disabled = page === 1;
        document.getElementById("nextPage").disabled = items.length < pageSize;
        if (!items.length) {
            container.innerHTML = '<div class="p-14 text-center text-slate-400 text-sm"><div class="text-3xl mb-3">✓</div><div class="font-bold text-slate-600">No notifications</div><div class="mt-1">You are all caught up.</div></div>';
            return;
        }
        container.innerHTML = items.map(item => `
            <button type="button" class="w-full text-left p-5 hover:bg-slate-50 transition ${item.is_read ? '' : 'bg-blue-50/50'}"
                    onclick="viewNotificationDetail('${escapeHTML(item.id)}'); loadNotificationHistory(currentPage)">
                <div class="flex gap-3">
                    <span class="mt-0.5 w-7 h-7 rounded-full flex items-center justify-center text-xs font-black ${item.is_read ? 'bg-slate-100 text-slate-500' : 'bg-blue-100 text-blue-700'}">${notificationIcon(item.notification_type)}</span>
                    <span class="min-w-0 flex-1">
                        <span class="flex justify-between gap-4">
                            <strong class="text-sm ${item.is_read ? 'text-slate-700' : 'text-slate-900'}">${escapeHTML(item.title)}</strong>
                            <time class="text-xs text-slate-400 whitespace-nowrap">${item.created_at ? new Date(item.created_at).toLocaleString() : ''}</time>
                        </span>
                        <span class="block text-[10px] uppercase tracking-wide text-slate-400 mt-1">${escapeHTML(item.notification_type || 'General')}</span>
                        <span class="block text-sm text-slate-600 mt-1">${escapeHTML(item.message)}</span>
                    </span>
                </div>
            </button>`).join("");
    } catch (error) {
        container.innerHTML = '<div class="p-10 text-center text-rose-500 text-sm">Unable to load notifications. Please try again.</div>';
    }
}
async function markAllNotificationsRead() {
    const response = await fetch("/api/v1/notifications/read-all", {method: "PUT"});
    if (!response.ok) {
        showToast("Unable to update notifications.", "error");
        return;
    }
    await loadNotificationHistory(currentPage);
}
document.addEventListener("DOMContentLoaded", () => loadNotificationHistory(1));
</script>
{% endblock %}
