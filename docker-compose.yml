services:
  api:
    build: .
    container_name: kpi_production_app
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_SCHEDULER=true
      - RUN_SCHEDULER=false
      - SKIP_DATABASE_SEED=true
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  scheduler:
    build: .
    container_name: kpi_scheduler
    restart: always
    env_file:
      - .env
    environment:
      - ENV=production
      - ENABLE_SCHEDULER=true
      - RUN_SCHEDULER=true
      - REDIS_URL=redis://redis:6379/0
      - SKIP_DATABASE_SEED=true
      - SKIP_DATABASE_MIGRATIONS=true
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: kpi_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: kpi_minio
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  redis_data: