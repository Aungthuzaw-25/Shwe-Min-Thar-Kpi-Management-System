services:
  api:
    build: .
    container_name: kpi_production_app
    restart: always
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_SCHEDULER=true
      - RUN_SCHEDULER=false
      - SKIP_DATABASE_SEED=true
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: kpi_web
    restart: always
    environment:
      PORT: 3000
      ENV: production
      API_BASE_URL: http://api:8000
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      TIMEZONE: ${TIMEZONE:-Asia/Yangon}
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    container_name: kpi_proxy
    restart: always
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  scheduler:
    build: .
    container_name: kpi_scheduler
    restart: always
    env_file:
      - .env
    environment:
      - ENV=production
      - ENABLE_SCHEDULER=true
      - RUN_SCHEDULER=true
      - REDIS_URL=redis://redis:6379/0
      - SKIP_DATABASE_SEED=true
      - SKIP_DATABASE_MIGRATIONS=true
      - ENABLE_BATCH_NOTIFICATIONS=false
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: kpi_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: kpi-minio-community:RELEASE.2025-09-07T16-13-09Z
    build:
      context: ./docker/minio
      args:
        MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
    container_name: kpi_minio
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  redis_data: