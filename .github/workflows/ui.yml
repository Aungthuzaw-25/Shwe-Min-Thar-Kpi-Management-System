name: Isolated UI Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kpi
          POSTGRES_PASSWORD: kpi
          POSTGRES_DB: kpi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kpi -d kpi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENV: test
      PROJECT_NAME: KPI Test
      VERSION: 1.0.0
      SECRET_KEY: ci-isolated-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DATABASE_URL: postgresql+asyncpg://kpi:kpi@127.0.0.1:5432/kpi_test
      USE_S3: "False"
      REDIS_URL: redis://127.0.0.1:6379/0
      ENABLE_SCHEDULER: "false"
      RUN_SCHEDULER: "false"
      TIMEZONE: Asia/Yangon
      SEED_SUPER_ADMIN_PASSWORD: SuperSecret123!
      SEED_DEMO_PASSWORD: user@12345AmZm
      SEED_L2_PASSWORD: user@12345AmZm
      SEED_L0_PASSWORD: user@12345AmZm
      SEED_L1_PASSWORD: Secret123!
      UI_TEST_SUPERADMIN_EMAIL: superadmin@kpi.com
      UI_TEST_SUPERADMIN_PASSWORD: SuperSecret123!
      UI_TEST_L2_EMAIL: cashier.mdy@kpi.com
      UI_TEST_L2_PASSWORD: user@12345AmZm
      UI_TEST_L0_EMAIL: finance.l0@kpi.com
      UI_TEST_L0_PASSWORD: user@12345AmZm
      UI_TEST_L1_EMAIL: finance.l1@kpi.com
      UI_TEST_L1_PASSWORD: Secret123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 libmagic-dev
      - name: Install test dependencies and Chromium
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run migrations
        run: alembic upgrade head
      - name: Seed isolated UI database
        run: python -m app.database.seed
      - name: Start application
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ui-server.log 2>&1 &
          echo $! > ui-server.pid
      - name: Wait for health endpoint
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          cat ui-server.log
          exit 1
      - name: Run Playwright tests
        run: python -m pytest tests/test_ui_dashboard.py -q --junitxml=playwright-results.xml
      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: |
            playwright-results.xml
            ui-server.log
      - name: Shut down application
        if: always()
        run: |
          if [ -f ui-server.pid ]; then kill "$(cat ui-server.pid)" || true; fi
