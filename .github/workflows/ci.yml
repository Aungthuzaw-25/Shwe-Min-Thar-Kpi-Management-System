name: KPI System CI Pipeline

"on":
  push:
    branches:
      - main
      - master
      - fix-ci-workflow

  pull_request:
    branches:
      - main
      - master
      - fix-ci-workflow

jobs:
  node-web:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 # v4.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Node dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Run Node tests
        working-directory: web
        run: npm test

      - name: Build production web image
        run: |
          docker build \
            --file web/Dockerfile \
            --tag kpi-management-web:${{ github.sha }} \
            .

  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ENV: "development"
      PROJECT_NAME: "Enterprise KPI System"
      VERSION: "1.0.0"

      JWT_SECRET_KEY: "ci-only-test-key-not-for-deployment"
      JWT_ALGORITHM: "HS256"

      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

      DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      USE_S3: "False"
      S3_ENDPOINT: "http://localhost:9000"
      S3_ACCESS_KEY: "ci-placeholder"
      S3_SECRET_KEY: "ci-placeholder"
      S3_BUCKET_NAME: "kpi-evidence"

      ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"

      REDIS_URL: "redis://localhost:6379/0"
      ENABLE_SCHEDULER: "false"
      TIMEZONE: "Asia/Yangon"

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 libmagic-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes --requirement requirements-dev.lock

      - name: Validate database configuration
        shell: bash
        run: |
          echo "DATABASE_URL is set: ${DATABASE_URL:+yes}"

          if [[ "$DATABASE_URL" == postgresql* || "$DATABASE_URL" == postgres* ]]; then
            echo "Using Postgres/Neon database URL"
          else
            echo "Using fallback SQLite in-memory database"
          fi

      - name: Run tests
        shell: bash
        run: |
          python -m pytest tests \
            --ignore=tests/test_ui_dashboard.py \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q

      - name: Validate Python syntax
        shell: bash
        run: python -m compileall -q app migrations tests

      - name: Audit dependencies
        shell: bash
        run: |
          python -m pip_audit -r requirements.lock

      - name: Validate application import
        shell: bash
        run: |
          python -c "from app.main import app; print(f'Loaded {app.title}')"

      - name: Build production Docker image
        run: |
          docker build \
            --tag kpi-management-system:${{ github.sha }} \
            .
