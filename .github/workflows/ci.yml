name: KPI System CI Pipeline

"on":
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ENV: "development"
      PROJECT_NAME: "Enterprise KPI System"
      VERSION: "1.0.0"

      SECRET_KEY: "ci-test-secret-key-1234567890"
      ALGORITHM: "HS256"

      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"

      DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      USE_S3: "False"
      S3_ENDPOINT: "http://localhost:9000"
      S3_ACCESS_KEY: "ci-placeholder"
      S3_SECRET_KEY: "ci-placeholder"
      S3_BUCKET_NAME: "kpi-evidence"

      ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"

      REDIS_URL: "redis://localhost:6379/0"
      ENABLE_SCHEDULER: "false"
      TIMEZONE: "Asia/Yangon"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 libmagic-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Validate database configuration
        shell: bash
        run: |
          echo "DATABASE_URL is set: ${DATABASE_URL:+yes}"

          if [[ "$DATABASE_URL" == postgresql* || "$DATABASE_URL" == postgres* ]]; then
            echo "Using Postgres/Neon database URL"
          else
            echo "Using fallback SQLite in-memory database"
          fi

      - name: Run tests
        shell: bash
        run: |
          python -m pytest tests \
            --ignore=tests/test_ui_dashboard.py \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Audit dependencies
        shell: bash
        run: |
          python -m pip_audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-1325

      - name: Validate application import
        shell: bash
        run: |
          python -c "from app.main import app; print(f'Loaded {app.title}')"

      - name: Check SonarQube configuration
        id: sonar_config
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SonarQube configuration found."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube configuration not found. Skipping SonarQube analysis."
          fi

      - name: SonarQube analysis
        if: steps.sonar_config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build production Docker image
        run: |
          docker build \
            --tag kpi-management-system:${{ github.sha }} \
            .