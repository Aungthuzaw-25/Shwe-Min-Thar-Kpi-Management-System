# Secret scan — fails the run if the repo tracks a real secret.
# Runs on every push and pull request, plus on push to main after a
# merge (the backstop if a PR ever weakened the script itself).
# The script never prints a value, only file:line and the variable name.
# It catches accidental commits, not a determined attacker rewriting
# the script — see scripts/check_no_secrets.py for the exact rules
# and limits.

name: Secret Scan

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan tracked files for secrets
        run: python3 scripts/check_no_secrets.py
