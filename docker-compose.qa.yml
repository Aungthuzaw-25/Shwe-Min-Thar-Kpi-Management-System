name: kpi_management_system_qa

services:
  postgres-qa:
    image: postgres:16-alpine
    container_name: kpi_postgres_qa
    restart: "no"
    environment:
      POSTGRES_DB: ${QA_POSTGRES_DB:-kpi_qa}
      POSTGRES_USER: ${QA_POSTGRES_USER:-kpi_qa}
      POSTGRES_PASSWORD: ${QA_POSTGRES_PASSWORD:?QA_POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:55472:5432"
    volumes:
      - postgres_qa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api-qa:
    build: .
    container_name: kpi_api_qa
    restart: "no"
    env_file:
      - .env.qa
    environment:
      ENV: qa
      DATABASE_URL: postgresql+asyncpg://${QA_POSTGRES_USER:-kpi_qa}:${QA_POSTGRES_PASSWORD}@postgres-qa:5432/${QA_POSTGRES_DB:-kpi_qa}
      REDIS_URL: redis://redis-qa:6379/0
      S3_ENDPOINT: http://minio-qa:9000
      SKIP_DATABASE_SEED: "true"
      SKIP_DATABASE_MIGRATIONS: "true"
      PORT: 8000
      ENABLE_SCHEDULER: "true"
      RUN_SCHEDULER: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      start_period: 45s
      retries: 5
    depends_on:
      postgres-qa:
        condition: service_healthy
      redis-qa:
        condition: service_healthy
      minio-qa:
        condition: service_healthy

  web-qa:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: kpi_web_qa
    restart: "no"
    environment:
      PORT: 3000
      ENV: qa
      API_BASE_URL: http://api-qa:8000
      S3_ENDPOINT: http://minio-qa:9000
      TIMEZONE: ${TIMEZONE:-Asia/Yangon}
    depends_on:
      api-qa:
        condition: service_healthy

  proxy-qa:
    image: nginx:1.27-alpine
    container_name: kpi_proxy_qa
    restart: "no"
    ports:
      - "127.0.0.1:18000:80"
    volumes:
      - ./proxy/qa.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-qa:
        condition: service_healthy
      web-qa:
        condition: service_healthy

  scheduler-qa:
    build: .
    container_name: kpi_scheduler_qa
    restart: "no"
    env_file:
      - .env.qa
    environment:
      ENV: qa
      DATABASE_URL: postgresql+asyncpg://${QA_POSTGRES_USER:-kpi_qa}:${QA_POSTGRES_PASSWORD}@postgres-qa:5432/${QA_POSTGRES_DB:-kpi_qa}
      REDIS_URL: redis://redis-qa:6379/0
      S3_ENDPOINT: http://minio-qa:9000
      SKIP_DATABASE_SEED: "true"
      SKIP_DATABASE_MIGRATIONS: "true"
      ENABLE_SCHEDULER: "true"
      RUN_SCHEDULER: "true"
    healthcheck:
      disable: true
    depends_on:
      postgres-qa:
        condition: service_healthy
      redis-qa:
        condition: service_healthy
      minio-qa:
        condition: service_healthy

  redis-qa:
    image: redis:7-alpine
    container_name: kpi_redis_qa
    restart: "no"
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_qa_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-qa:
    image: kpi-minio-community:RELEASE.2025-09-07T16-13-09Z
    build:
      context: ./docker/minio
      args:
        MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
    container_name: kpi_minio_qa
    restart: "no"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    environment:
      MINIO_ROOT_USER: ${QA_MINIO_ROOT_USER:-qa-minio-user}
      MINIO_ROOT_PASSWORD: ${QA_MINIO_ROOT_PASSWORD:?QA_MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_qa_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_qa_data:
    external: true
    name: kpi_management_system_postgres_qa_data
  redis_qa_data:
    external: true
    name: kpi_management_system_redis_qa_data
  minio_qa_data:
    external: true
    name: kpi_management_system_minio_qa_data

networks:
  default:
    name: kpi_management_system_qa
