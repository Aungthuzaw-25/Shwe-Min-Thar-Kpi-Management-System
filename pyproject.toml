[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
(
  /(
      \.venv
    | uploads
    | static/vendor
    | migrations/versions
  )/
)
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".venv",
  "uploads",
  "static/vendor",
  "migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI evaluates these request-metadata declarations per request; they are not mutable defaults.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.File",
]
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
