sonar.projectKey=kpi-management-system
sonar.organization=aungthuzaw-25
sonar.projectName=KPI Management System
sonar.projectVersion=1.0

sonar.sources=app,templates,static
sonar.tests=tests

sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
**/__pycache__/**,\
**/.venv/**,\
**/venv/**,\
**/env/**,\
**/.pytest_cache/**,\
**/.mypy_cache/**,\
**/.ruff_cache/**,\
**/node_modules/**,\
**/static/vendor/**,\
**/uploads/**,\
**/reports/**,\
**/logs/**,\
**/generated/**,\
**/tmp/**,\
**/*.min.js,\
**/*.min.css,\
**/*.pem,\
**/*.key,\
**/*.p12,\
**/*.pfx,\
**/.env,\
**/.env.*,\
**/alembic/versions/**

sonar.test.exclusions=\
**/__pycache__/**,\
**/.venv/**,\
**/uploads/**,\
**/reports/**

sonar.python.coverage.reportPaths=coverage.xml

sonar.cpd.exclusions=\
**/tests/**,\
**/alembic/versions/**