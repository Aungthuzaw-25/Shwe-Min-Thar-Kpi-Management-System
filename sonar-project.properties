sonar.projectKey=kpi-management-system
sonar.organization=aungthuzaw-25
sonar.projectName=Shwe-Min-Thar-Kpi-Management-System
sonar.projectVersion=1.0

sonar.sources=app,templates,static
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Node.js configuration for JS/TS/CSS analysis
# Do NOT hardcode sonar.nodejs.executable here: an OS-specific path
# (e.g. a Windows C:/ path committed from a local machine) breaks the
# scan on Linux CI runners. Leaving it unset lets the scanner use its
# embedded Node.js runtime, or Node.js from PATH when available.
# Local runs that need a specific Node.js can pass it on the command
# line instead: -Dsonar.nodejs.executable=<path-to-node>
sonar.javascript.node.maxspace=4096

# Local, generated, temporary, secret, vendor, and build outputs
sonar.exclusions=\
**/.venv/**,\
**/venv/**,\
**/env/**,\
**/.mypy_cache/**,\
**/.pytest_cache/**,\
**/.ruff_cache/**,\
**/__pycache__/**,\
**/*.pyc,\
.coverage,\
coverage.xml,\
.env,\
.env.*,\
uploads/**,\
logs/**,\
reports/**,\
tmp/**,\
temp/**,\
**/node_modules/**,\
static/css/output.css,\
static/vendor/**,\
**/*.min.js,\
**/*.min.css,\
**/*.pem,\
**/*.key,\
**/*.p12,\
**/*.pfx,\
migrations/versions/**

sonar.test.exclusions=\
**/.venv/**,\
**/venv/**,\
**/env/**,\
**/.mypy_cache/**,\
**/.pytest_cache/**,\
**/.ruff_cache/**,\
**/__pycache__/**,\
**/*.pyc,\
.coverage,\
coverage.xml,\
.env,\
.env.*,\
uploads/**,\
logs/**,\
reports/**,\
tmp/**,\
temp/**,\
**/node_modules/**

sonar.python.coverage.reportPaths=coverage.xml

# Migration revisions are database history rather than application source
sonar.cpd.exclusions=migrations/versions/**