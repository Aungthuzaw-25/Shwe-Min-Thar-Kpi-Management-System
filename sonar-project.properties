sonar.projectKey=Aungthuzaw-25_Shwe-Min-Thar-Kpi-Management-System
sonar.organization=aungthuzaw-25
sonar.projectName=Shwe-Min-Thar-Kpi-Management-System
sonar.projectVersion=1.0

# Source and test directories

sonar.sources=app,templates
sonar.tests=tests

# Python

sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Files/directories excluded from SonarQube source analysis

sonar.exclusions=
**/**pycache**/**,
**/.venv/**,
**/venv/**,
**/env/**,
**/.pytest_cache/**,
**/.mypy_cache/**,
**/.ruff_cache/**,
**/node_modules/**,
**/static/vendor/**,
**/uploads/**,
**/reports/**,
**/logs/**,
**/generated/**,
**/tmp/**,
**/*.min.js,
**/*.min.css,
**/*.pem,
**/*.key,
**/*.p12,
**/*.pfx,
**/.env,
**/.env.*,
**/alembic/versions/**

# Test exclusions

sonar.test.exclusions=
**/**pycache**/**,
**/.venv/**,
**/venv/**,
**/env/**,
**/.pytest_cache/**,
**/.mypy_cache/**,
**/.ruff_cache/**,
**/node_modules/**,
**/uploads/**,
**/reports/**

# Python coverage generated by pytest-cov

sonar.python.coverage.reportPaths=coverage.xml

# Ignore duplicated-code detection for tests and generated migration files

sonar.cpd.exclusions=
**/tests/**,
**/alembic/versions/**
